# rapture-recomp config for Disney's Rooftop Ruckus (1999).
# Only file names, guest bases and addresses: no code or data of the game.
# The user's original files are read from --game-dir at build time.

game = "ruckus"
title = "Rooftop Ruckus"
# Settings (the registry of the original) are kept in %APPDATA%\<settings>.
settings = "Ruckus/ruckus-recomp.ini"

# Guest bases. Ruckus.dll, moses.dll and Aaron.dll all prefer 0x10000000,
# so the recompiler rebases moses and Aaron statically (same layout as MuShoot).
[[module]]
file = "Ruckus.exe"
base = "0x00400000"

[[module]]
file = "Ruckus.dll"
base = "0x10000000"

[[module]]
file = "moses.dll"
base = "0x10100000"

[[module]]
file = "Aaron.dll"
base = "0x10200000"

# Function entries the discovery pass cannot find on its own (none yet).
[extra_functions]

# Differential test: moses.dll and Aaron.dll are the same files as MuShoot's,
# so the same Aaron x87-flag helpers differ under Unicorn.
[difftest]
known_differences = ["0x102179cd", "0x102179cf", "0x102179f7", "0x1021aef1", "0x1021aeff", "0x1021af31"]

# Function replacements (addresses of the original files): the VC6 small-block
# allocator __sbh_alloc_block of each module returns 0, so every allocation
# goes to the Win32 layer's heap (freed blocks stay intact for a while). See
# configs/mushoot.toml. The exe, moses.dll and Aaron.dll addresses are the
# same as MuShoot's; Ruckus.dll has its own.
[replace."Ruckus.exe"]
"0x0041235f" = "return0_cdecl"
[replace."Ruckus.dll"]
"0x1001e568" = "return0_cdecl"
[replace."moses.dll"]
"0x1000e21d" = "return0_cdecl"
[replace."Aaron.dll"]
"0x10015ddd" = "return0_cdecl"
